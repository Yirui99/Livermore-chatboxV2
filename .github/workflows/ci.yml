# CI: install, unit tests, CLI smoke test.
#
# Not run here (local only, see CHANGELOG / benchmarks/):
#   - benchmarks/equivalence.py and benchmarks/run_all.sh: need the gated Llama-3.2-1B weights
#     (2.5 GB, license acceptance) and an Apple GPU; hosted runners have no Metal device, so
#     latency/throughput numbers from CI would be meaningless.
#   - the stage-4 eval gate (`livermore eval`) will be added as its own job once the eval set exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]   # macos-14 = Apple Silicon (arm64)
    env:
      TOKENIZERS_PARALLELISM: "false"
      # Pinned in livermore/models.py; the index in kb_data/ was built with this revision.
      EMBED_REPO: sentence-transformers/all-MiniLM-L6-v2
      EMBED_REV: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only torch (Linux; avoids multi-GB CUDA wheels)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install livermore
        run: pip install -e ".[dev]"

      - name: Check the pinned revision matches the workflow
        run: |
          python - <<'EOF'
          import os
          from livermore.models import PINNED
          assert PINNED[os.environ["EMBED_REPO"]] == os.environ["EMBED_REV"], "update EMBED_REV in ci.yml"
          EOF

      # Tests copy models out of the HF cache (verified offline against blob hashes),
      # so one cached download serves every test's temporary LIVERMORE_HOME.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ runner.os }}-${{ env.EMBED_REV }}

      - name: Prefetch embedding model (pinned revision)
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download
          from livermore.models import ALLOW
          snapshot_download(os.environ["EMBED_REPO"], revision=os.environ["EMBED_REV"], allow_patterns=ALLOW)
          EOF

      - name: Unit tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q tests -p no:warnings

      - name: CLI smoke test
        env:
          HF_HUB_OFFLINE: "1"
          LIVERMORE_HOME: ${{ runner.temp }}/livermore
        run: |
          set -e
          livermore --version
          livermore config init
          # Hosted runners have no Metal GPU (and Linux has no MLX): check the torch path.
          sed -i.bak 's/^backend: mlx/backend: torch/' "$LIVERMORE_HOME/config.yaml"
          livermore config show
          livermore models fetch "$EMBED_REPO"
          livermore doctor
          livermore stats --since all
          # Errors are one line with a hint, not a traceback.
          out=$(livermore ask "hi" --index /nonexistent 2>&1) && exit 1 || true
          echo "$out"
          echo "$out" | grep -q "livermore: error: no index at /nonexistent"
          if echo "$out" | grep -q Traceback; then echo "traceback leaked"; exit 1; fi
