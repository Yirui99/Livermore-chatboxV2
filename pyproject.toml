[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livermore"
dynamic = ["version"]
description = "Local notes Q&A engine for Apple Silicon: FAISS retrieval + pluggable generation backends (MLX 4-bit, PyTorch, from-scratch Transformer)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "faiss-cpu",
    "sentence-transformers",
    "torch",
    "transformers",
    "tokenizers",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
app = ["streamlit"]
examples = ["yfinance", "pandas", "matplotlib"]

[project.scripts]
livermore = "livermore.cli:main"

[tool.setuptools.dynamic]
version = { attr = "livermore.__version__" }

[tool.setuptools.packages.find]
include = ["livermore*"]
